name: Build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android build dependencies
        run: sdkmanager 'ndk;29.0.14206865' 'build-tools;36.0.0' 'cmake;3.31.6'
      - name: Test configuration and process scope
        run: |
          g++ -std=c++23 -Wall -Wextra -Werror -I native tests/config_test.cpp -o /tmp/soraxhook-config-test
          /tmp/soraxhook-config-test
      - name: Test compressed ART symbols
        run: |
          git clone https://github.com/tukaani-project/xz-embedded.git /tmp/soraxhook-xz
          git -C /tmp/soraxhook-xz checkout ae63ae3a36ed01724674e8f3d750dc47bf125410
          bash tests/run_host_tests.sh /tmp/soraxhook-xz
          bash tests/config_init_test.sh
      - name: Build
        run: >-
          python scripts/build.py
          --ndk "$ANDROID_HOME/ndk/29.0.14206865"
          --build-tools "$ANDROID_HOME/build-tools/36.0.0"
          --cmake "$ANDROID_HOME/cmake/3.31.6/bin/cmake"
          --ninja "$ANDROID_HOME/cmake/3.31.6/bin/ninja"
          --abis arm64-v8a
      - uses: actions/upload-artifact@v4
        with:
          name: SoraXHook
          path: dist/*
